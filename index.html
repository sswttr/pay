<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pay</title>
<meta name="description" content="记录每月贷款还款和个人借款的小账本">
<meta name="theme-color" content="#f4f4f6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#15171c" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pay">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@500;600;700&family=Noto+Sans+SC:wght@400;500;700;900&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
/* Layout: warm canvas with a rose glow at the top; header (title left, 贷款/个人 switch right); an overview row — two colour tiles + one insight card (repayment calendar / debt mix); then the detail table closed by 合计 rows */
:root{
  --bg:#f4f4f6; --glow:rgb(120 125 150 / .10); --glow2:rgb(230 170 100 / .07);
  --card:#ffffff; --card2:#f3f5f9; --line:#e9ecf2; --ink:#161b26; --muted:#7f8696; --faint:#c5cad5;
  --accent:#0f8f8c; --accent-soft:#dff3f1; --accent-ink:#0b7472; --on-accent:#ffffff; --today:#e0861d; --today-soft:#fcefd9; --owe:#d9452f; --owe-soft:#fdeae5; --owe-soft2:#fff7f4; --green-soft2:#f4fbf7; --seg1:#2c3240; --seg2:#1b1f29; --orange:#ea7a46; --orange-soft:#fdeee5;
  --green:#19a35a; --green-soft:#e3f5eb; --yellow:#c99200; --yellow-soft:#fbf2d8;
  --purple:#8a58de; --purple-soft:#f0e9fc; --blue:#2f7ae0; --blue-soft:#e6effc; --teal:#0f9a8e; --teal-soft:#dff4f1;
  --tile-a1:#4a7dfa; --tile-a2:#2350cf; --tile-b1:#f8bd5a; --tile-b2:#ee8b2b;
  --navy1:#1f2a44; --navy2:#121a2c;
  --seg-bg:rgb(255 255 255 / .75); --border:rgb(29 26 28 / .05);
  --shadow:0 1px 2px rgb(20 30 60 / .04), 0 14px 34px -22px rgb(30 50 110 / .24);
  --sans:-apple-system,"PingFang SC","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;
  --num:"SF Pro Display",-apple-system,"IBM Plex Sans","Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#15171c; --glow:rgb(150 155 180 / .07); --glow2:rgb(230 170 100 / .04);
  --card:#1e222b; --card2:#272c37; --line:#2e3441; --ink:#eef1f6; --muted:#9299a8; --faint:#555c6a; --navy1:#283453; --navy2:#1a2238;
  --accent:#3cc9c2; --accent-soft:rgb(60 201 194 / .14); --accent-ink:#5ad8d1; --on-accent:#0d1717; --today:#ffb257; --today-soft:rgb(255 178 87 / .16); --owe:#ff7a5e; --owe-soft:rgb(255 122 94 / .16); --owe-soft2:rgb(255 122 94 / .05); --green-soft2:rgb(63 211 127 / .04); --seg1:#343a49; --seg2:#252a36; --orange:#ff9a66; --orange-soft:rgb(255 154 102 / .15);
  --green:#3fd37f; --green-soft:rgb(63 211 127 / .14); --yellow:#ffc845; --yellow-soft:rgb(255 200 69 / .14);
  --purple:#b88cff; --purple-soft:rgb(184 140 255 / .16); --blue:#6fb0ff; --blue-soft:rgb(111 176 255 / .15); --teal:#40d0c1; --teal-soft:rgb(64 208 193 / .14);
  --seg-bg:rgb(45 44 51 / .8); --border:rgb(255 255 255 / .05);
  --shadow:0 1px 2px rgb(0 0 0 / .25), 0 14px 34px -22px rgb(0 0 0 / .7); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#15171c; --glow:rgb(150 155 180 / .07); --glow2:rgb(230 170 100 / .04);
  --card:#1e222b; --card2:#272c37; --line:#2e3441; --ink:#eef1f6; --muted:#9299a8; --faint:#555c6a; --navy1:#283453; --navy2:#1a2238;
  --accent:#3cc9c2; --accent-soft:rgb(60 201 194 / .14); --accent-ink:#5ad8d1; --on-accent:#0d1717; --today:#ffb257; --today-soft:rgb(255 178 87 / .16); --owe:#ff7a5e; --owe-soft:rgb(255 122 94 / .16); --owe-soft2:rgb(255 122 94 / .05); --green-soft2:rgb(63 211 127 / .04); --seg1:#343a49; --seg2:#252a36; --orange:#ff9a66; --orange-soft:rgb(255 154 102 / .15);
  --green:#3fd37f; --green-soft:rgb(63 211 127 / .14); --yellow:#ffc845; --yellow-soft:rgb(255 200 69 / .14);
  --purple:#b88cff; --purple-soft:rgb(184 140 255 / .16); --blue:#6fb0ff; --blue-soft:rgb(111 176 255 / .15); --teal:#40d0c1; --teal-soft:rgb(64 208 193 / .14);
  --seg-bg:rgb(45 44 51 / .8); --border:rgb(255 255 255 / .05);
  --shadow:0 1px 2px rgb(0 0 0 / .25), 0 14px 34px -22px rgb(0 0 0 / .7); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--bg)}
body{color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;
  background:var(--bg)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1000px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:8px 14px;padding-block:14px 12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:14px}
.top h1{margin:0;font-size:26px;font-weight:900;letter-spacing:.06em;line-height:1}
.status{font-size:12.5px;color:var(--muted)}
.status.bad{color:var(--orange)}
.seg{display:flex;padding:4px;border-radius:14px;background:linear-gradient(180deg,var(--seg1),var(--seg2));border:1px solid rgb(255 255 255 / .06);box-shadow:0 2px 6px -2px rgb(20 24 36 / .35),inset 0 1px 0 rgb(255 255 255 / .08);flex:none}
.seg a{padding:8px 20px;border-radius:10px;text-decoration:none;color:rgb(255 255 255 / .6);font-weight:600;font-size:14.5px;white-space:nowrap}
.seg a:hover{color:#fff}
.seg a[aria-current="page"]{background:linear-gradient(180deg,#1aaaa3,#0b7d78);color:#fff;box-shadow:inset 0 1px 0 rgb(255 255 255 / .28),0 1px 3px rgb(11 125 120 / .5)}

main{padding-block:0 12px;display:grid;gap:10px}

/* overview */
.ov{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,330px);gap:12px}
.tiles{display:grid;gap:14px;grid-template-rows:1fr 1fr}
.tile{position:relative;overflow:hidden;border-radius:22px;padding:16px 18px;color:#fff;display:flex;flex-direction:column;min-height:128px;min-width:0}
.tile.a{background:linear-gradient(150deg,var(--tile-a1),var(--tile-a2));box-shadow:0 14px 30px -18px rgb(35 80 207 / .7)}
.tile.b{background:linear-gradient(150deg,var(--tile-b1),var(--tile-b2));box-shadow:0 14px 30px -18px rgb(238 139 43 / .7)}
.tile::after{content:"";position:absolute;right:-30px;bottom:-40px;width:130px;height:130px;border-radius:50%;background:rgb(255 255 255 / .1)}
.tile .k{display:flex;justify-content:space-between;align-items:center;font-size:13.5px;font-weight:600;opacity:.95}
.tile .k svg{width:18px;height:18px;opacity:.9}
.tile .v{font-family:var(--num);font-variant-numeric:tabular-nums;font-weight:700;font-size:clamp(22px,3.2vw,30px);margin-top:6px;white-space:nowrap;letter-spacing:.01em}
.tile .v small{font-size:.6em;opacity:.85;margin-right:2px}
.tile .f{margin-top:auto;font-size:12px;opacity:.9;position:relative;z-index:1}
.tile .pb{height:5px;border-radius:3px;background:rgb(255 255 255 / .28);overflow:hidden;margin-bottom:7px}
.tile .pb i{display:block;height:100%;background:#fff;border-radius:3px}

.card{background:var(--card);border-radius:22px;box-shadow:var(--shadow);border:1px solid var(--border);overflow:hidden;min-width:0}
.ins{padding:10px 14px 12px}
.ins h3{margin:0 0 6px;font-size:14.5px;font-weight:700;display:flex;justify-content:space-between;align-items:center}
.ins h3 small{font-weight:500;color:var(--muted);font-size:12px}
.meta{display:flex;align-items:center;gap:10px}
.iconbtn-unused{width:34px;height:34px;border-radius:10px;background:var(--card);border:1px solid var(--border);box-shadow:var(--shadow);display:grid;place-items:center;color:var(--muted);flex:none}
.iconbtn:hover{color:var(--ink)}
.iconbtn svg{width:18px;height:18px}
/* sync button */
.syncbtn{position:relative;width:44px;height:44px;border-radius:14px;display:grid;place-items:center;color:#fff;flex:none;
  background:linear-gradient(180deg,var(--seg1),var(--seg2));border:1px solid rgb(255 255 255 / .06);
  box-shadow:0 2px 6px -2px rgb(20 24 36 / .35),inset 0 1px 0 rgb(255 255 255 / .08)}
.syncbtn:hover{color:#7fe3dd}
.syncbtn .ic{width:23px;height:23px}
.syncbtn .sdot{position:absolute;top:7px;right:7px;width:9px;height:9px;border-radius:50%;background:#8a90a0;box-shadow:0 0 0 2px var(--seg1)}
.syncbtn[data-state="ok"] .sdot{background:#3fd37f}
.syncbtn[data-state="syncing"] .sdot{background:#ffb257}
.syncbtn[data-state="err"] .sdot{background:#ff6a55}
.syncbtn[data-state="syncing"] .arr{animation:lift 1s ease-in-out infinite}
@keyframes lift{0%,100%{transform:translateY(1px);opacity:.6}50%{transform:translateY(-1.5px);opacity:1}}
/* sync sheet */
.sync-hero{display:flex;flex-direction:column;align-items:center;gap:8px;margin-bottom:16px}
.sync-hero .orb{width:58px;height:58px;border-radius:18px;display:grid;place-items:center;color:#fff;background:linear-gradient(160deg,#1aaaa3,#0b6f6b);box-shadow:0 12px 24px -12px rgb(11 125 120 / .9),inset 0 1px 0 rgb(255 255 255 / .3)}
.sync-hero .orb svg{width:30px;height:30px}
.sync-hero h3{margin:4px 0 0}
.sbox{border:1px solid var(--line);border-radius:16px;padding:14px;display:grid;gap:10px;background:var(--card)}
.sbox+.sbox{margin-top:12px}
.sbox .hd{display:flex;align-items:center;justify-content:space-between;gap:8px;font-weight:700;font-size:14.5px}
.sbox .hd small{font-weight:500;font-size:12px;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:7px;background:var(--card2);color:var(--muted);white-space:nowrap}
.pill i{width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.ok{background:var(--green-soft);color:var(--green)} .pill.syncing{background:var(--today-soft);color:var(--today)} .pill.err{background:var(--owe-soft);color:var(--owe)}
.sbox p{margin:0;font-size:12.5px;color:var(--muted);line-height:1.65}
.sbox ol{margin:0;padding-left:18px;font-size:12.5px;color:var(--muted);line-height:1.8}
.sbox a{color:var(--accent-ink);font-weight:600}
.sbox input{font:inherit;font-size:15px;color:var(--ink);background:var(--card2);border:1.5px solid transparent;border-radius:12px;padding:10px 12px;width:100%;min-width:0}
.sbox input:focus{outline:none;border-color:var(--accent)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn.teal{background:linear-gradient(180deg,#1aaaa3,#0b7d78);color:#fff}
.btn.sm{padding:8px 12px;font-size:13.5px}
.choice{display:grid;gap:8px;padding:12px;border-radius:12px;background:var(--today-soft)}
.choice p{color:var(--ink)}
@media (prefers-reduced-motion:reduce){.syncbtn[data-state="syncing"] .arr{animation:none}}
/* month stats */
.stat{padding:12px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat .st{border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;justify-content:center}
.stat .st.o{background:linear-gradient(145deg,var(--owe-soft),var(--owe-soft2))}
.stat .st.g{background:linear-gradient(145deg,var(--green-soft),var(--green-soft2))}
.st{min-width:0}
.st .k{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px;font-weight:500}
.st .kd{width:7px;height:7px;border-radius:2px;display:inline-block}
.st .v{font-family:var(--num);font-variant-numeric:tabular-nums;font-weight:700;font-size:clamp(22px,3.4vw,32px);margin-top:2px;white-space:nowrap;letter-spacing:.01em}
.st .v small{font-size:.58em;margin-right:2px;opacity:.7}
.st .v.owe{color:var(--owe)} .st .v.ok{color:var(--green)}
.st .s{font-size:12px;color:var(--muted);margin-top:2px}
.sp{grid-column:1/-1;display:flex;align-items:center;gap:10px;margin-top:14px;font-size:12px;color:var(--muted);font-family:var(--num);font-variant-numeric:tabular-nums}
.sp .pb{flex:1;height:6px;border-radius:3px;background:var(--card2);overflow:hidden}
.sp .pb i{display:block;height:100%;background:var(--green);border-radius:3px}
.mv{display:inline-flex;gap:4px}
.mv button{width:30px;height:28px;border-radius:8px;background:var(--card2);display:grid;place-items:center}
.mv button:hover:not(:disabled){background:var(--accent);color:var(--on-accent)}
.mv button:disabled{opacity:.3;cursor:default}
.mv svg{width:14px;height:14px}
tbody tr.sorting{cursor:default}
/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:2px 3px;text-align:center}
.cal .wd{font-size:10px;color:var(--muted)}
.cal .d{position:relative;font-family:var(--num);font-size:12px;font-variant-numeric:tabular-nums;color:var(--muted);height:20px;width:28px;justify-self:center;display:grid;place-items:center;border-radius:7px}
.cal .d.due{color:#fff;font-weight:700;background:var(--owe)}
.cal .d.paid{color:#fff;font-weight:700;background:var(--green)}
.cal .d.today{background:var(--today);color:#fff;font-weight:800}
.cal .d.due.today,.cal .d.paid.today{background:var(--today);color:#fff}
.cal .d.due.today::after,.cal .d.paid.today::after{content:"";position:absolute;bottom:-3px;left:50%;width:6px;height:6px;margin-left:-3px;border-radius:50%;border:1.5px solid var(--card)}
.cal .d.due.today::after{background:var(--owe)} .cal .d.paid.today::after{background:var(--green)}
.cal .d .n{position:absolute;top:-4px;right:-3px;font-size:9px;min-width:13px;height:13px;border-radius:7px;background:var(--ink);color:var(--card);display:grid;place-items:center;padding:0 3px}
.legend{display:flex;gap:9px;font-size:11px;font-weight:500;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:4px;vertical-align:-1px}
/* debt mix */
.mix{display:flex;height:14px;border-radius:6px;overflow:hidden;gap:2px;background:var(--card2)}
.mix i{display:block;height:100%}
.mixl{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:7px}
.mixl li{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:8px;align-items:center;font-size:13px}
.mixl .dot{width:8px;height:8px;border-radius:50%}
.mixl .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mixl .pc{color:var(--muted);font-size:12px;font-family:var(--num);min-width:34px;text-align:right}

/* personal summary (below the table) */
.dsum{border-radius:22px;padding:20px 22px;color:#eef1f6;background:radial-gradient(400px 160px at 100% 0%,rgb(107 149 255 / .22),transparent 70%),linear-gradient(150deg,var(--navy1),var(--navy2));box-shadow:0 18px 36px -22px rgb(18 26 44 / .8)}
.dsum-top{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:22px;align-items:start}
.dsum .sep{width:1px;align-self:stretch;background:rgb(255 255 255 / .12)}
.dsum .k{font-size:13px;color:rgb(238 241 246 / .62);font-weight:500}
.dsum .v{font-family:var(--num);font-variant-numeric:tabular-nums;font-weight:700;font-size:clamp(22px,4vw,32px);margin-top:4px;white-space:nowrap}
.dsum .v.owe{color:#ff9a7e} .dsum .v.ok{color:#6ee49c}
.dsum .s{font-size:12px;color:rgb(238 241 246 / .58);margin-top:4px}
.dsum-bar{margin-top:18px;height:8px;border-radius:4px;background:rgb(255 154 126 / .3);overflow:hidden}
.dsum-bar i{display:block;height:100%;background:#6ee49c;border-radius:4px}
.dsum-foot{display:flex;justify-content:space-between;margin-top:8px;font-size:12px;color:rgb(238 241 246 / .58)}

/* ledger card */
.ch{display:flex;align-items:center;gap:10px;padding:12px 18px 4px}
.ch h2{margin:0;font-size:17px;font-weight:700}
.badge{font-size:12px;font-weight:600;padding:3px 9px;border-radius:7px;background:var(--accent-soft);color:var(--accent-ink);white-space:nowrap}
.badge.ok{background:var(--green-soft);color:var(--green)}
.add{margin-left:auto;display:inline-flex;align-items:center;gap:5px;padding:6px 12px;border-radius:10px;background:var(--card2);font-weight:600;font-size:13.5px;white-space:nowrap}
.add svg{width:14px;height:14px}
.add:hover{background:var(--accent);color:var(--on-accent)}
.add+.add{margin-left:0}
.add[hidden]+.add{margin-left:auto}
.add.on{background:var(--accent);color:var(--on-accent)}

table{width:100%;border-collapse:collapse}
th,td{padding:8px 8px;text-align:left;vertical-align:middle}
th:first-child,td:first-child{padding-left:18px}
th:last-child,td:last-child{padding-right:18px}
thead th{font-size:12px;font-weight:500;color:var(--muted);padding-block:6px;border-bottom:1px solid var(--line);white-space:nowrap}
tbody tr{cursor:pointer}
tbody tr+tr td{border-top:1px solid var(--line)}
tbody tr:hover td{background:var(--card2)}
.r{text-align:right}
tfoot td{padding-block:3px;font-weight:600;background:var(--card2)}
tfoot tr:first-child td{padding-top:8px}
tfoot tr:last-child td{padding-bottom:9px}
tfoot .lbl{font-weight:700}
tfoot .lbl small{font-weight:400;color:var(--muted);font-size:12px;margin-left:6px}
tfoot .sublbl{color:var(--muted);font-weight:500;font-size:13.5px}

.loan{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-width:0}
.bank{font-weight:700;font-size:15px}
.tg{display:inline-flex;align-items:center;padding:2px 8px;border-radius:6px;font-weight:600;font-size:12.5px;background:var(--x-soft);color:var(--x);white-space:nowrap;line-height:1.5}
.who{display:inline-flex;align-items:center;gap:8px;padding:5px 12px 5px 10px;border-radius:10px;background:var(--x-soft);color:var(--ink);font-weight:700;font-size:14.5px;max-width:100%}
.who .dot{width:8px;height:8px;border-radius:50%;background:var(--x);flex:none}
.who span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sub{font-size:12px;color:var(--muted);margin-top:4px}
.mo{display:none}
.amt{font-family:var(--num);font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.amt.red{color:var(--owe)} .amt.green{color:var(--green)} .amt.dim{color:var(--faint)}
.day{font-family:var(--num);font-variant-numeric:tabular-nums;font-weight:500;white-space:nowrap}
.state{display:block;font-size:11.5px;margin-top:2px;font-weight:600}
.state.late{color:var(--orange)} .state.today{color:var(--owe)}
tr.done td{color:var(--muted)}
tr.done .bank{color:var(--muted)}
tr.done .tg,tr.done .who{filter:grayscale(1);opacity:.7}

.chk{display:inline-flex;align-items:center;gap:7px;border-radius:10px;padding:3px 11px 3px 3px;background:var(--card2);font-size:13px;color:var(--muted);white-space:nowrap}
.chk .dot{width:22px;height:22px;border-radius:7px;border:1.5px solid var(--faint);display:grid;place-items:center;background:var(--card)}
.chk svg{width:12px;height:12px;display:none}
.chk[aria-checked="true"]{background:var(--green-soft);color:var(--green);font-weight:700}
.chk[aria-checked="true"] .dot{background:var(--green);border-color:var(--green);color:#fff}
.chk[aria-checked="true"] svg{display:block}
.chk:disabled{cursor:default}
.paidoff{font-size:12px;font-weight:600;padding:3px 8px;border-radius:6px;background:var(--green-soft);color:var(--green)}

.tip{display:flex;align-items:flex-start;gap:6px;margin:0 4px;font-size:12px;color:var(--muted)}
.tip svg{width:14px;height:14px;flex:none;margin-top:1px}
.empty{padding:30px 18px 34px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:15.5px;margin-bottom:4px}
.empty .acts{margin-top:16px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.btn{border-radius:12px;padding:9px 18px;font-weight:700;font-size:14px;background:var(--card2)}
.btn.primary{background:var(--accent);color:var(--on-accent)}

/* sheet */
.scrim{position:fixed;inset:0;z-index:40;background:rgb(10 16 30 / .45);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:16px}
.sheet{background:var(--card);border-radius:24px;width:min(440px,100%);max-height:92vh;overflow:auto;padding:22px;box-shadow:0 30px 60px -20px rgb(0 0 0 / .4)}
.sheet h3{margin:0 0 18px;font-size:18px;font-weight:700;text-align:center}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fields label{display:flex;flex-direction:column;gap:6px;font-size:12.5px;color:var(--muted);min-width:0}
.fields .full{grid-column:1/-1}
.fields input{font:inherit;font-size:16px;color:var(--ink);background:var(--card2);border:1.5px solid transparent;border-radius:12px;padding:11px 12px;width:100%;min-width:0}
.fields input:focus{outline:none;border-color:var(--accent);background:var(--card)}
.err{color:var(--owe);font-size:13px;margin-top:10px}
.sheet .acts{display:flex;gap:10px;margin-top:22px;align-items:center}
.sheet .acts .grow{flex:1}
.btn.danger{background:none;color:var(--owe);padding-inline:6px}

@media (max-width:760px){
  .ov{grid-template-columns:minmax(0,1fr);gap:12px}
  .stat{padding:10px;gap:10px}
  .stat .st{padding:12px 13px}
  .tiles{grid-template-columns:1fr 1fr;grid-template-rows:auto;gap:12px}
  .tile{min-height:128px;padding:14px 15px}
}
@media (max-width:700px){
  .dk{display:none} .mo{display:block}
  th,td{padding-inline:5px}
  th:first-child,td:first-child{padding-left:16px}
  th:last-child,td:last-child{padding-right:16px}
  .ch{padding-inline:16px}
  .amt{font-size:13.5px}
  .bank{font-size:14.5px}
  .who{font-size:13.5px;padding:4px 10px 4px 8px}
  .chk{padding:4px}
  .chk .lb{display:none}
  .top h1{font-size:23px}
  .meta{width:100%;justify-content:space-between}
  .seg a{padding:7px 15px}
  .scrim{align-items:flex-end;padding:0}
  .sheet{width:100%;border-radius:24px 24px 0 0;padding-bottom:calc(22px + env(safe-area-inset-bottom,0px))}
}
@media (max-width:420px){
  .amt .dec0{display:none}
  .fields{grid-template-columns:1fr}
  .add .lb{display:none}
}
@media (prefers-reduced-motion:no-preference){
  .scrim .sheet{animation:up .22s ease-out}
  @keyframes up{from{transform:translateY(18px);opacity:.6}to{transform:none;opacity:1}}
}
</style>
</head>
<body>

<header class="wrap top">
  <div class="brand">
    <h1>Pay</h1>
    <button class="syncbtn" id="sync-btn" type="button" aria-label="备份与同步" title="备份与同步" data-state="off">
      <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M7 18.5h10.2a4.3 4.3 0 0 0 .6-8.56A6 6 0 0 0 6.3 9.6 4.5 4.5 0 0 0 7 18.5Z"/><path class="arr" d="M9.6 13.6 12 11.2l2.4 2.4M12 11.4v4.6"/></svg>
      <i class="sdot" aria-hidden="true"></i>
    </button>
    <nav class="seg" aria-label="页面">
      <a href="#loans" id="tab-loans">贷款</a>
      <a href="#personal" id="tab-personal">个人</a>
    </nav>
  </div>
  <div class="meta"><div class="status" id="status">正在读取…</div></div>
</header>

<main class="wrap" id="page-loans">
  <div class="ov" id="ov-loans"></div>
  <section class="card">
    <div class="ch"><h2 id="loan-title">还款明细</h2><span class="badge" id="loan-badge" hidden></span><button class="add" id="sort-btn" data-sort="1" hidden><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 2.5v11M2.5 5 5 2.5 7.5 5M11 13.5v-11M8.5 11l2.5 2.5 2.5-2.5"/></svg><span class="lb">排序</span></button><button class="add" data-add="loans"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 3v10M3 8h10"/></svg><span class="lb">添加</span></button></div>
    <div id="tb-loans"></div>
  </section>
</main>

<main class="wrap" id="page-personal" hidden>
  <section class="card">
    <div class="ch"><h2>借款明细</h2><span class="badge" id="debt-badge" hidden></span><button class="add" data-add="debts"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 3v10M3 8h10"/></svg><span class="lb">添加</span></button></div>
    <div id="tb-debts"></div>
  </section>
  <section class="dsum" id="sum-debts" hidden></section>
</main>
<div id="dlg-root"></div>

<script>
(() => {
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = n => (Number(n)||0).toLocaleString("zh-CN",{minimumFractionDigits:2,maximumFractionDigits:2});
const fmt0 = n => (Number(n)||0).toLocaleString("zh-CN",{maximumFractionDigits:2});
const yen = (n, cls="") => { const s = fmt(n); const i = s.lastIndexOf("."); const dec = s.slice(i);
  return `<span class="amt ${cls}">¥${s.slice(0,i)}<span class="${dec===".00"?"dec0":""}">${dec}</span></span>`; };
const uid = () => Math.random().toString(36).slice(2,10);
const pad = n => String(n).padStart(2,"0");
const now = new Date();
const Y = now.getFullYear(), M = now.getMonth(), D = now.getDate();
const monthKey = `${Y}-${pad(M+1)}`;
const daysInMonth = new Date(Y, M+1, 0).getDate();
const COLORS = ["blue","orange","purple","teal","yellow","green"];
const hashC = s => { let h=0; for(const ch of String(s||"?")) h=(h*31+ch.codePointAt(0))>>>0; return COLORS[h%COLORS.length]; };
function loanColor(name){
  const n = String(name||"");
  for(const [k,c] of [["公积金","green"],["房","blue"],["车","teal"],["信用卡","orange"],["分期","orange"],["经营","purple"],["消费","yellow"],["装修","purple"]]) if(n.includes(k)) return c;
  return hashC(n);
}
const xs = c => `--x:var(--${c});--x-soft:var(--${c}-soft)`;
const CHECK = `<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 6.3 5 8.6 9.6 3.6"/></svg>`;
const I_BOLT = `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M13.5 2 4 13.5h6.5L9.5 22 20 9.5h-6.6L13.5 2Z"/></svg>`;
const I_CHECK = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9.5" stroke-width="2"/><path d="m7.5 12.3 3 3 6-6.3"/></svg>`;

let data = {loans:[], subs:[], debts:[]};
let ref = null, canWrite = false, loaded = false, sortMode = false;
const I_UP = `<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 13V3M3.5 7.5 8 3l4.5 4.5"/></svg>`;
const I_DOWN = `<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3v10M3.5 8.5 8 13l4.5-4.5"/></svg>`;

function route(){
  const p = (location.hash === "#personal" || location.hash === "#debts") ? "personal" : "loans";
  $("#page-loans").hidden = p !== "loans";
  $("#page-personal").hidden = p !== "personal";
  for(const k of ["loans","personal"]){ const a = $("#tab-"+k); if(k===p) a.setAttribute("aria-current","page"); else a.removeAttribute("aria-current"); }
}
addEventListener("hashchange", route); route();

const KEY = "pay-ledger-v1";
function setStatus(t, bad){ const el = $("#status"); el.textContent = `${Y}年${M+1}月${D}日 · ${t}`; el.classList.toggle("bad", !!bad); }
function saveLocal(){
  try { localStorage.setItem(KEY, JSON.stringify(data)); return true; }
  catch(e){ setStatus("保存失败：浏览器不允许本地存储", true); return false; }
}
function save(){ if(saveLocal()) setStatus(sync.token ? "已保存，正在同步…" : "已保存在本机"); }
function commit(){ data.updatedAt = Date.now(); render(); save(); scheduleSync(); }

function empty(title, hint, type){
  const all = !data.loans.length && !data.debts.length;
  const btns = (loaded && canWrite) ? `<div class="acts"><button class="btn primary" data-add="${type}">+ 添加第一条</button>${all?`<button class="btn" data-sample="1">填入示例数据</button>`:""}</div>` : "";
  return `<div class="empty"><b>${loaded?title:"正在读取…"}</b>${hint}${btns}</div>`;
}
const tile = (cls, k, icon, v, foot) => `<div class="tile ${cls}"><div class="k">${k}${icon}</div><div class="v"><small>¥</small>${fmt(v)}</div><div class="f">${foot}</div></div>`;
const loanLabel = l => `${esc(l.lender||"")} ${esc(l.name||"")}`.trim();

function render(){
  /* ---------- loans ---------- */
  const loans = [...data.loans];
  const lSum = loans.reduce((s,l)=>s+(+l.amount||0),0);
  const paidL = loans.filter(l=>l.paid?.[monthKey]);
  const lPaid = paidL.reduce((s,l)=>s+(+l.amount||0),0);
  const pending = loans.filter(l=>!l.paid?.[monthKey]);
  const next = [...pending].sort((a,b)=>(+a.day||0)-(+b.day||0)).find(l=>+l.day>=D) || null;
  const lateN = pending.filter(l=>+l.day<D).length;
  const lPct = lSum ? Math.round(lPaid/lSum*100) : 0;

  // overview
  const calCells = [];
  const first = (new Date(Y,M,1).getDay()+6)%7;
  ["一","二","三","四","五","六","日"].forEach(w=>calCells.push(`<div class="wd">${w}</div>`));
  for(let i=0;i<first;i++) calCells.push(`<div></div>`);
  for(let d=1; d<=daysInMonth; d++){
    const on = loans.filter(l=>Math.min(+l.day||0,daysInMonth)===d);
    const allPaid = on.length && on.every(l=>l.paid?.[monthKey]);
    const cls = on.length ? (allPaid?"paid":"due") : "";
    const tip = on.map(l=>`${loanLabel(l)} ¥${fmt0(l.amount)}${l.paid?.[monthKey]?"（已还）":""}`).join("、");
    calCells.push(`<div class="d ${cls} ${d===D?"today":""}" ${tip?`title="${tip}"`:""}>${d}${on.length>1?`<span class="n">${on.length}</span>`:""}</div>`);
  }
  const nextTxt = !pending.length ? "本月已全部还清" : [next?`下一笔 ${esc(next.day)}日 · ${loanLabel(next)}`:"", lateN?`${lateN} 笔已过还款日`:""].filter(Boolean).join(" · ") || `还有 ${pending.length} 笔`;
  $("#ov-loans").innerHTML = loans.length ? `
    <div class="card stat">
      <div class="st o"><div class="k"><i class="kd" style="background:var(--owe)"></i>本月待还</div><div class="v owe"><small>¥</small>${fmt(lSum-lPaid)}</div><div class="s">${nextTxt}</div></div>
      <div class="st g"><div class="k"><i class="kd" style="background:var(--green)"></i>本月已还</div><div class="v ok"><small>¥</small>${fmt(lPaid)}</div><div class="s">应还 ¥${fmt0(lSum)} · ${paidL.length}/${loans.length} 笔</div></div>
    </div>
    <div class="card ins"><h3>${M+1}月还款日历<span class="legend"><span><i style="background:var(--owe)"></i>未还</span><span><i style="background:var(--green)"></i>已还</span><span><i style="background:var(--today)"></i>今天</span></span></h3><div class="cal">${calCells.join("")}</div></div>` : "";

  $("#loan-title").textContent = `${M+1}月还款明细`;
  const lb = $("#loan-badge"); lb.hidden = !loans.length;
  lb.textContent = paidL.length===loans.length ? "本月已还清" : `已还 ${paidL.length}/${loans.length}`; lb.className = "badge"+(paidL.length===loans.length?" ok":"");
  $("#tb-loans").innerHTML = loans.length ? `<table>
    <thead><tr><th>贷款</th><th>还款日</th><th class="r"><span class="dk">每月还款额</span><span class="mo">月供</span></th><th class="r">${sortMode?"顺序":`<span class="dk">本月已还</span><span class="mo">已还</span>`}</th></tr></thead>
    <tbody>${loans.map((l,i)=>{
      const paid = !!l.paid?.[monthKey], d = +l.day||0;
      const st = paid ? "" : d < D ? `<span class="state late">已过</span>` : d === D ? `<span class="state today">今天</span>` : (d-D<=3 ? `<span class="state late">${d-D}天后</span>` : "");
      return `<tr ${sortMode?"":`data-edit="loans:${l.id}"`} class="${paid&&!sortMode?"done":""} ${sortMode?"sorting":""}">
        <td><div class="loan"><span class="bank">${esc(l.lender||"未填银行")}</span><span class="tg" style="${xs(loanColor(l.name))}">${esc(l.name)}</span></div></td>
        <td><span class="day">${esc(l.day)}日</span>${st}</td>
        <td class="r">${yen(l.amount)}</td>
        <td class="r">${sortMode?`<span class="mv"><button type="button" data-mv="-1:${l.id}" aria-label="上移" ${i===0?"disabled":""}>${I_UP}</button><button type="button" data-mv="1:${l.id}" aria-label="下移" ${i===loans.length-1?"disabled":""}>${I_DOWN}</button></span>`:`<button class="chk" type="button" role="checkbox" aria-checked="${paid}" aria-label="${loanLabel(l)} 本月已还" data-paid="${l.id}" ${canWrite?"":"disabled"}><span class="dot">${CHECK}</span><span class="lb">${paid?"已还":"未还"}</span></button>`}</td>
      </tr>`;
    }).join("")}</tbody>
    <tfoot>
      <tr><td class="lbl">合计<small>${loans.length} 笔</small></td><td></td><td class="r">${yen(lSum)}</td><td class="r"><span class="amt" style="color:var(--muted)">${paidL.length}/${loans.length}</span></td></tr>
    </tfoot></table>`
  : empty("还没有贷款记录","添加房贷、车贷、信用卡分期等，每月还完勾一下。","loans");

  /* ---------- personal ---------- */
  const debts = [...data.debts].sort((a,b)=>{
    const la=(+a.amount||0)-(+a.repaid||0), lb2=(+b.amount||0)-(+b.repaid||0);
    if((la<=0)!==(lb2<=0)) return la<=0?1:-1;
    return (a.date||"9").localeCompare(b.date||"9");
  });
  const dSum = debts.reduce((s,d)=>s+(+d.amount||0),0);
  const dRep = debts.reduce((s,d)=>s+Math.min(+d.repaid||0,+d.amount||0),0);
  const owing = debts.map(d=>({d, left:Math.max(0,(+d.amount||0)-(+d.repaid||0))})).filter(x=>x.left>0).sort((a,b)=>b.left-a.left);
  const dLeft = dSum-dRep, dPct = dSum?Math.round(dRep/dSum*100):0;
  const oldest = owing.filter(x=>x.d.date).sort((a,b)=>a.d.date.localeCompare(b.d.date))[0];

  const sd = $("#sum-debts"); sd.hidden = !debts.length;
  if(debts.length) sd.innerHTML = `<div class="dsum-top">
      <div><div class="k">尚欠</div><div class="v owe">¥${fmt(dLeft)}</div><div class="s">${owing.length?`${owing.length} 笔未还清`+(oldest?` · 最早借于 ${esc(oldest.d.date)}`:""):"全部还清了"}</div></div>
      <div class="sep"></div>
      <div><div class="k">已还</div><div class="v ok">¥${fmt(dRep)}</div><div class="s">借款总额 ¥${fmt0(dSum)}</div></div>
    </div>
    <div class="dsum-bar" role="img" aria-label="已还 ${dPct}%"><i style="width:${dPct}%"></i></div>
    <div class="dsum-foot"><span>已还 ${dPct}%</span><span>还剩 ${100-dPct}%</span></div>`;

  const dbg = $("#debt-badge"); dbg.hidden = !debts.length;
  dbg.textContent = owing.length?`${owing.length} 笔未还清`:"全部还清"; dbg.className = "badge"+(owing.length?"":" ok");
  $("#tb-debts").innerHTML = debts.length ? `<table>
    <thead><tr><th>债权人</th><th class="dk">借款时间</th><th class="r">金额</th><th class="r">已还</th><th class="r">未还</th></tr></thead>
    <tbody>${debts.map(d=>{
      const amt = +d.amount||0, rep = Math.min(+d.repaid||0, amt), left = amt-rep;
      return `<tr data-edit="debts:${d.id}" class="${left<=0?"done":""}">
        <td><span class="who" style="${xs(hashC(d.person))}"><i class="dot"></i><span>${esc(d.person)}</span></span><div class="sub mo">${esc(d.date||"—")}</div></td>
        <td class="dk"><span class="day">${esc(d.date||"—")}</span></td>
        <td class="r">${yen(amt)}</td>
        <td class="r">${yen(rep, rep?"green":"dim")}</td>
        <td class="r">${left>0?yen(left,"red"):`<span class="paidoff">已还清</span>`}</td>
      </tr>`;
    }).join("")}</tbody>
    <tfoot><tr><td class="lbl">合计<small>${debts.length} 笔</small></td><td class="dk"></td><td class="r">${yen(dSum)}</td><td class="r">${yen(dRep,"green")}</td><td class="r">${yen(dLeft,"red")}</td></tr></tfoot>
    </table>`
  : empty("还没有借款记录","记下债权人、金额和借款时间，之后随时更新已还金额。","debts");

  document.querySelectorAll(".ch .add").forEach(b=>b.hidden=!canWrite);
  const sb = $("#sort-btn"); sb.hidden = !canWrite || data.loans.length < 2; if(data.loans.length < 2) sortMode = false;
  sb.classList.toggle("on", sortMode); sb.querySelector(".lb").textContent = sortMode ? "完成" : "排序"; sb.setAttribute("aria-pressed", sortMode);
}

/* forms */
const LOAN_TYPES = ["房贷","车贷","信用卡分期","消费贷","经营贷","公积金贷款","装修贷"];
const FORMS = {
  loans:{title:"贷款", fields:[
    {k:"lender",l:"贷款银行",t:"text",req:1,ph:"如：南海农商"},
    {k:"name",l:"贷款种类",t:"text",req:1,ph:"如：房贷",list:"loan-types"},
    {k:"day",l:"还款日（每月几号）",t:"number",req:1,min:1,max:31,step:1},
    {k:"amount",l:"每月还款额 (¥)",t:"number",req:1,min:0,step:0.01},
  ]},
  debts:{title:"借款", fields:[
    {k:"person",l:"债权人",t:"text",req:1,ph:"如：张三",full:1},
    {k:"amount",l:"金额 (¥)",t:"number",req:1,min:0,step:0.01},
    {k:"date",l:"借款时间",t:"date"},
    {k:"repaid",l:"已还 (¥)",t:"number",min:0,step:0.01,full:1},
  ]},
};
let lastFocus = null;
function closeDlg(){ $("#dlg-root").innerHTML = ""; lastFocus?.focus?.(); }
function openForm(type, id){
  if(!canWrite) return;
  const cfg = FORMS[type]; const item = id ? data[type].find(x=>x.id===id) : null;
  const v = item || (type==="debts"?{repaid:0}:{});
  lastFocus = document.activeElement;
  const fields = cfg.fields.map(f=>{
    const fid = `f-${type}-${f.k}`;
    return `<label for="${fid}" class="${f.full?"full":""}">${f.l}<input id="${fid}" name="${f.k}" type="${f.t}" ${f.t==="number"?`step="${f.step}" inputmode="decimal"`:""} ${f.min!=null?`min="${f.min}"`:""} ${f.max!=null?`max="${f.max}"`:""} ${f.ph?`placeholder="${esc(f.ph)}"`:""} ${f.list?`list="${f.list}"`:""} value="${esc(v[f.k]??"")}" ${f.req?"required":""}></label>`;
  }).join("");
  $("#dlg-root").innerHTML = `<div class="scrim" id="scrim"><form class="sheet" id="dlg-form" role="dialog" aria-modal="true" aria-labelledby="dlg-title">
    <h3 id="dlg-title">${item?"编辑":"添加"}${cfg.title}</h3>
    <div class="fields">${fields}</div>
    <datalist id="loan-types">${LOAN_TYPES.map(t=>`<option value="${t}">`).join("")}</datalist>
    <div class="err" id="dlg-err" hidden></div>
    <div class="acts">${item?`<button type="button" class="btn danger" id="dlg-del">删除</button>`:""}<span class="grow"></span>
      <button type="button" class="btn" id="dlg-cancel">取消</button><button type="submit" class="btn primary">保存</button></div>
  </form></div>`;
  $("#scrim").addEventListener("click", e=>{ if(e.target.id==="scrim") closeDlg(); });
  $("#dlg-cancel").onclick = closeDlg;
  const del = $("#dlg-del");
  if(del) del.onclick = () => {
    if(del.dataset.armed){ data[type] = data[type].filter(x=>x.id!==id); closeDlg(); commit(); }
    else { del.dataset.armed = "1"; del.textContent = "再点一次确认删除"; }
  };
  $("#dlg-form").addEventListener("submit", e=>{
    e.preventDefault(); const f = e.target; const out = {...(item||{id:uid()})};
    for(const fd of cfg.fields){
      const el = f.elements[fd.k];
      out[fd.k] = fd.t==="number" ? (el.value===""?0:Number(el.value)) : el.value.trim();
    }
    if(type==="debts" && out.repaid > out.amount){ const er=$("#dlg-err"); er.hidden=false; er.textContent="已还金额不能大于借款金额。"; return; }
    if(type==="loans") out.paid = {...(item?.paid||{})};
    if(item) Object.assign(item, out); else data[type].push(out);
    closeDlg(); commit();
  });
  setTimeout(()=>document.querySelector("#dlg-form input")?.focus(),0);
}

function loadSample(){
  data.loans = [
    {id:uid(),name:"房贷",lender:"示例·南海农商",amount:6800,day:15,paid:{}},
    {id:uid(),name:"车贷",lender:"示例·平安银行",amount:2350,day:5,paid:{[monthKey]:true}},
    {id:uid(),name:"信用卡分期",lender:"示例·中信银行",amount:860,day:22,paid:{}},
  ];
  data.debts = [
    {id:uid(),person:"示例·朋友",amount:20000,repaid:8000,date:"2026-03-01"},
    {id:uid(),person:"示例·家人",amount:50000,repaid:0,date:"2025-10-01"},
  ];
  commit();
}

document.addEventListener("click", e=>{
  const t = e.target.closest("[data-paid],[data-add],[data-sample],[data-edit],[data-sort],[data-mv]"); if(!t) return;
  if(t.dataset.sort){ sortMode = !sortMode; render(); $("#sort-btn")?.focus(); return; }
  if(t.dataset.mv){ const [dir,id] = t.dataset.mv.split(":"); const i = data.loans.findIndex(x=>x.id===id), j = i + Number(dir);
    if(i<0 || j<0 || j>=data.loans.length) return; [data.loans[i], data.loans[j]] = [data.loans[j], data.loans[i]]; commit();
    requestAnimationFrame(()=>{ const b = document.querySelector(`[data-mv="${dir}:${id}"]`); (b && !b.disabled ? b : document.querySelector(`[data-mv="${-dir}:${id}"]`))?.focus(); }); return; }
  if(t.dataset.paid){ if(!canWrite) return; const l = data.loans.find(x=>x.id===t.dataset.paid); if(!l) return;
    l.paid = {...(l.paid||{})}; if(l.paid[monthKey]) delete l.paid[monthKey]; else l.paid[monthKey] = true; commit();
    requestAnimationFrame(()=>document.querySelector(`[data-paid="${l.id}"]`)?.focus()); }
  else if(t.dataset.add) openForm(t.dataset.add);
  else if(t.dataset.sample) loadSample();
  else if(t.dataset.edit){ const [ty,id] = t.dataset.edit.split(":"); openForm(ty,id); }
});
document.addEventListener("keydown", e=>{ if(e.key==="Escape" && $("#dlg-root").innerHTML) closeDlg(); });


/* ---------- backup & sync ---------- */
function normalize(b){
  return {
    loans:(Array.isArray(b?.loans)?b.loans:[]).map(x=>({...x, paid:{...(x.paid||{})}})),
    subs:Array.isArray(b?.subs)?b.subs:[],
    debts:(Array.isArray(b?.debts)?b.debts:[]).map(x=>({...x})),
    updatedAt:Number(b?.updatedAt)||0,
  };
}
const hasData = d => !!(d && ((d.loans||[]).length || (d.debts||[]).length));
const SYNC_KEY = "pay-sync-v1", GIST_FILE = "pay-data.json", GIST_DESC = "Pay 还款数据同步（请勿删除）";
let sync = {}; try { sync = JSON.parse(localStorage.getItem(SYNC_KEY)||"{}") || {}; } catch(e){}
let syncState = sync.token ? "idle" : "off", syncErr = "", syncing = false, syncAgain = false, syncTimer = 0, pendingChoice = null;
function saveSync(){ try { localStorage.setItem(SYNC_KEY, JSON.stringify(sync)); } catch(e){} }
function ago(t){ if(!t) return "从未"; const s = Math.round((Date.now()-t)/1000);
  if(s<60) return "刚刚"; if(s<3600) return Math.floor(s/60)+" 分钟前"; if(s<86400) return Math.floor(s/3600)+" 小时前";
  const d = new Date(t); return `${d.getMonth()+1}月${d.getDate()}日 ${pad(d.getHours())}:${pad(d.getMinutes())}`; }
function setSync(st){
  syncState = st;
  $("#sync-btn").dataset.state = st === "idle" ? "ok" : st;
  if(st==="ok") setStatus("已同步 · "+ago(sync.lastSync));
  else if(st==="err") setStatus("同步失败："+syncErr, true);
  else if(st==="syncing") setStatus("正在同步…");
  if($("#sync-body")) renderSyncBody();
}
async function gh(path, opt={}){
  let r;
  try { r = await fetch("https://api.github.com"+path, {...opt, cache:"no-store", headers:{Accept:"application/vnd.github+json", Authorization:"Bearer "+sync.token, ...(opt.body?{"Content-Type":"application/json"}:{})}}); }
  catch(e){ const er = new Error("网络不可用"); er.status = 0; throw er; }
  if(!r.ok){ const er = new Error(r.status===401?"令牌无效或已过期":r.status===403?"令牌没有 gist 权限或请求过多":r.status===404?"找不到云端数据":"GitHub 返回错误 "+r.status); er.status = r.status; throw er; }
  return r.status===204 ? null : r.json();
}
async function findGist(){
  for(let page=1; page<=5; page++){
    const list = await gh(`/gists?per_page=100&page=${page}`);
    const g = list.find(x=>x.description===GIST_DESC && x.files && x.files[GIST_FILE]);
    if(g) return g.id; if(list.length<100) break;
  }
  return null;
}
async function readRemote(){
  const g = await gh(`/gists/${sync.gistId}`); const f = g.files && g.files[GIST_FILE]; if(!f) return null;
  let txt = f.content; if(f.truncated) txt = await (await fetch(f.raw_url, {cache:"no-store"})).text();
  return normalize(JSON.parse(txt));
}
async function pushRemote(){
  const files = {[GIST_FILE]:{content:JSON.stringify({app:"Pay", ...data}, null, 1)}};
  if(sync.gistId) await gh(`/gists/${sync.gistId}`, {method:"PATCH", body:JSON.stringify({description:GIST_DESC, files})});
  else { const g = await gh(`/gists`, {method:"POST", body:JSON.stringify({description:GIST_DESC, public:false, files})}); sync.gistId = g.id; }
}
async function syncNow(){
  if(!sync.token || pendingChoice) return;
  if(syncing){ syncAgain = true; return; }
  syncing = true; setSync("syncing");
  try {
    if(!sync.gistId) sync.gistId = await findGist();
    let remote = null;
    if(sync.gistId){ try { remote = await readRemote(); } catch(e){ if(e.status===404){ sync.gistId = null; } else throw e; } }
    const lu = data.updatedAt||0, ru = remote?.updatedAt||0;
    if(remote && ru > lu){ data = remote; saveLocal(); render(); }
    else if(!remote || lu > ru){ await pushRemote(); }
    sync.lastSync = Date.now(); saveSync(); syncErr = ""; setSync("ok");
  } catch(e){ syncErr = e.message || "未知错误"; setSync("err"); }
  syncing = false;
  if(syncAgain){ syncAgain = false; syncNow(); }
}
function scheduleSync(){ if(!sync.token) return; clearTimeout(syncTimer); syncTimer = setTimeout(syncNow, 1200); }
async function connect(token){
  sync = {token}; setSync("syncing");
  try {
    const id = await findGist(); sync.gistId = id;
    const remote = id ? await readRemote() : null;
    if(remote && hasData(remote) && hasData(data) && JSON.stringify([remote.loans,remote.debts]) !== JSON.stringify([data.loans,data.debts])){
      saveSync(); pendingChoice = remote; syncing = false; setSync("idle"); renderSyncBody(); return;
    }
    if(remote && hasData(remote) && !hasData(data)){ data = remote; saveLocal(); render(); }
    else { data.updatedAt = Date.now(); saveLocal(); }
    saveSync(); syncState = "idle"; await syncNow();
  } catch(e){ sync = {}; saveSync(); syncErr = e.message; setSync("off"); const m = $("#sync-msg"); if(m){ m.hidden = false; m.textContent = "连接失败："+e.message; } }
}
function resolveChoice(useCloud){
  if(useCloud){ data = pendingChoice; }
  data.updatedAt = Date.now(); pendingChoice = null; saveLocal(); render(); syncNow();
}
function disconnect(){ sync = {}; saveSync(); pendingChoice = null; syncErr = ""; setSync("off"); setStatus("已断开云同步，数据仍保存在本机"); }

const I_CLOUD = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M7 18.5h10.2a4.3 4.3 0 0 0 .6-8.56A6 6 0 0 0 6.3 9.6 4.5 4.5 0 0 0 7 18.5Z"/><path d="M9.6 13.6 12 11.2l2.4 2.4M12 11.4v4.6"/></svg>`;
function renderSyncBody(){
  const el = $("#sync-body"); if(!el) return;
  const pill = sync.token
    ? (syncState==="syncing"?`<span class="pill syncing"><i></i>同步中</span>`:syncState==="err"?`<span class="pill err"><i></i>同步失败</span>`:`<span class="pill ok"><i></i>已开启</span>`)
    : `<span class="pill"><i></i>未开启</span>`;
  let cloud;
  if(pendingChoice){
    cloud = `<div class="choice"><p>云端和这台设备上都有数据，而且内容不一样。要保留哪一份？另一份会被覆盖。</p>
      <p style="color:var(--muted)">云端：${pendingChoice.loans.length} 笔贷款、${pendingChoice.debts.length} 笔借款 · 本机：${data.loans.length} 笔贷款、${data.debts.length} 笔借款</p>
      <div class="row2"><button type="button" class="btn teal sm" id="sy-cloud">用云端的</button><button type="button" class="btn sm" id="sy-local">用本机的</button></div></div>`;
  } else if(sync.token){
    cloud = `<p>${syncState==="err"?`<span style="color:var(--owe)">${esc(syncErr)}</span><br>`:""}上次同步：${ago(sync.lastSync)}。每次修改后会自动同步，打开页面时也会拉取最新数据。</p>
      <div class="row2"><button type="button" class="btn teal sm" id="sy-now" ${syncState==="syncing"?"disabled":""}>${syncState==="syncing"?"同步中…":"立即同步"}</button><button type="button" class="btn sm" id="sy-off">断开</button></div>`;
  } else {
    cloud = `<p>用你自己的 GitHub 账号保存一份私密数据，手机、电脑之间自动同步。数据不经过任何第三方。</p>
      <ol><li><a href="https://github.com/settings/tokens/new?scopes=gist&description=Pay%20sync" target="_blank" rel="noopener">点这里创建令牌</a>，只勾选 <b>gist</b>，有效期可选 No expiration</li><li>复制生成的令牌，粘贴到下面</li><li>其他设备上粘贴同一个令牌即可</li></ol>
      <input id="sy-token" type="password" autocomplete="off" spellcheck="false" placeholder="粘贴令牌：ghp_ 或 github_pat_ 开头">
      <button type="button" class="btn teal" id="sy-connect">连接并同步</button>
      <div class="err" id="sync-msg" hidden></div>`;
  }
  el.innerHTML = `<div class="sbox"><div class="hd">云同步 <small>GitHub</small><span style="margin-left:auto">${pill}</span></div>${cloud}</div>
    <div class="sbox"><div class="hd">本地备份 <small>JSON 文件</small></div>
      <p>导出一份文件保存到手机或网盘，需要时再恢复。</p>
      <div class="row2"><button type="button" class="btn sm" id="bk-export">导出备份</button><label class="btn sm" for="bk-file" style="text-align:center;cursor:pointer">从文件恢复</label></div>
      <input type="file" id="bk-file" accept="application/json,.json" hidden>
      <div class="err" id="bk-msg" hidden></div></div>`;
  const on = (id, fn) => { const b = $("#"+id); if(b) b.onclick = fn; };
  on("sy-now", syncNow); on("sy-off", disconnect);
  on("sy-cloud", ()=>resolveChoice(true)); on("sy-local", ()=>resolveChoice(false));
  on("sy-connect", ()=>{ const t = $("#sy-token").value.trim(); const m = $("#sync-msg");
    if(!/^(ghp_|github_pat_|gho_)/.test(t)){ m.hidden = false; m.textContent = "这看起来不像 GitHub 令牌，请重新复制。"; return; }
    $("#sy-connect").disabled = true; $("#sy-connect").textContent = "正在连接…"; connect(t); });
  on("bk-export", ()=>{
    const blob = new Blob([JSON.stringify({app:"Pay", exportedAt:new Date().toISOString(), ...data}, null, 2)], {type:"application/json"});
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = `Pay备份-${Y}${pad(M+1)}${pad(D)}.json`;
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
  });
  $("#bk-file").onchange = async e => {
    const f = e.target.files?.[0]; if(!f) return; const msg = $("#bk-msg"); msg.hidden = false;
    try {
      const b = JSON.parse(await f.text());
      if(!b || (!Array.isArray(b.loans) && !Array.isArray(b.debts))) throw 0;
      const nb = normalize(b);
      msg.style.color = "var(--ink)";
      msg.innerHTML = `文件里有 ${nb.loans.length} 笔贷款、${nb.debts.length} 笔借款，恢复后会替换当前数据。<div style="margin-top:10px"><button type="button" class="btn teal sm" id="bk-go">确认恢复</button></div>`;
      $("#bk-go").onclick = () => { data = nb; closeDlg(); commit(); setStatus("已从备份恢复"); };
    } catch(_) { msg.style.color = ""; msg.textContent = "这个文件不是 Pay 的备份文件，请重新选择。"; }
    e.target.value = "";
  };
}
function openSync(){
  lastFocus = document.activeElement;
  $("#dlg-root").innerHTML = `<div class="scrim" id="scrim"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="dlg-title">
    <div class="sync-hero"><span class="orb">${I_CLOUD}</span><h3 id="dlg-title">备份与同步</h3></div>
    <div id="sync-body"></div>
    <div class="acts"><span class="grow"></span><button type="button" class="btn" id="dlg-cancel">完成</button></div>
  </div></div>`;
  $("#scrim").addEventListener("click", e=>{ if(e.target.id==="scrim") closeDlg(); });
  $("#dlg-cancel").onclick = closeDlg;
  renderSyncBody();
}
$("#sync-btn").addEventListener("click", openSync);

/* load from this device */
try { const raw = localStorage.getItem(KEY) || localStorage.getItem("huankuan-ledger-v1"); if(raw) data = normalize(JSON.parse(raw)); } catch(e){}
loaded = true; canWrite = true;
render();
setStatus(data.loans.length || data.debts.length ? "数据保存在本机" : "开始记录吧");
setSync(syncState);
if(sync.token){ syncNow(); }
document.addEventListener("visibilitychange", ()=>{ if(document.visibilityState==="visible" && sync.token && Date.now()-(sync.lastSync||0) > 15000) syncNow(); });
addEventListener("online", ()=>{ if(sync.token) syncNow(); });

if("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(()=>{});
})();
</script>
